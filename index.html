<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZapLink - Gerador & Chat Global</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- QRCode.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
    
    .view-screen { transition: opacity 0.2s ease-in-out; }
    .view-screen.hidden-screen { display: none !important; opacity: 0; pointer-events: none; }

    .status-online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-offline { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 overflow-hidden select-none">

  <!-- TOP HEADER -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
        <i class="fa-brands fa-whatsapp text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base tracking-tight leading-none text-slate-100">ZapLink</h1>
        <p class="text-[10px] text-slate-400 leading-none mt-1">Chat Global & Cadastro</p>
      </div>
    </div>

    <!-- Status & Profile -->
    <div class="flex items-center gap-3">
      <div id="statusIndicator" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-800/80 border border-slate-700 text-xs">
        <span id="statusDot" class="w-2.5 h-2.5 rounded-full status-offline transition-all"></span>
        <span id="statusText" class="text-[11px] font-medium text-slate-300">Conectando...</span>
      </div>

      <button onclick="openProfileModal()" class="flex items-center gap-2 px-2.5 py-1 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700/80 rounded-full transition text-xs">
        <i class="fa-solid fa-user-gear text-emerald-400"></i>
        <span id="headerUserName" class="max-w-[80px] truncate font-medium text-slate-200">Perfil</span>
      </button>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <div class="bg-slate-900/50 border-b border-slate-800/80 px-2 py-1.5 flex gap-2 shrink-0 z-20">
    <button id="tabGeneratorBtn" onclick="switchTab('generator')" class="flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition bg-emerald-600 text-white shadow-lg">
      <i class="fa-solid fa-link"></i> Gerador de Links
    </button>
    <button id="tabChatBtn" onclick="switchTab('chat')" class="relative flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
      <i class="fa-solid fa-globe"></i> Chat Global <span id="onlineCountBadge" class="bg-emerald-500/20 text-emerald-400 text-[10px] px-1.5 py-0.2 rounded-full border border-emerald-500/30">1</span>
    </button>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 relative overflow-hidden bg-slate-950">

    <!-- SCREEN 1: LINK GENERATOR -->
    <section id="screenGenerator" class="view-screen h-full overflow-y-auto p-4 max-w-xl mx-auto flex flex-col justify-between">
      <div class="space-y-5">
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl">
          <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2 mb-3">
            <i class="fa-solid fa-bolt text-emerald-400"></i> Gerar Link Direto do WhatsApp
          </h2>
          
          <div class="space-y-3">
            <label class="block text-xs text-slate-400">Número do Zap (com DDD):</label>
            <input type="tel" id="genPhoneInput" placeholder="(79) 99999-9999" onkeyup="formatPhoneInput(this)" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 font-mono transition">

            <div>
              <label class="block text-xs text-slate-400 mb-1">Mensagem Inicial (Opcional):</label>
              <textarea id="genMessageInput" rows="2" placeholder="Olá! Vi seu contato pelo ZapLink..." class="w-full bg-slate-950 border border-slate-700/80 rounded-xl p-3 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition resize-none"></textarea>
            </div>

            <button onclick="generateWhatsappLink()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
              <i class="fa-brands fa-whatsapp text-lg"></i> Gerar Link & QR Code
            </button>
          </div>
        </div>

        <div id="genResultBox" class="hidden bg-slate-900/80 border border-emerald-500/30 rounded-2xl p-4 shadow-2xl space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <span class="text-xs font-semibold text-emerald-400">Link Gerado com Sucesso!</span>
            <button onclick="closeResultBox()" class="text-slate-500 hover:text-slate-300 text-xs"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs font-mono text-emerald-300 break-all select-all" id="generatedUrlText">https://wa.me/...</div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="copyGeneratedUrl()" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-medium border border-slate-700 flex items-center justify-center gap-1.5 transition"><i class="fa-solid fa-copy text-emerald-400"></i> Copiar</button>
            <a id="openGeneratedUrlBtn" href="#" target="_blank" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 transition"><i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir</a>
          </div>
          <div class="pt-2 flex flex-col items-center justify-center border-t border-slate-800/80">
            <div id="qrcode" class="p-3 bg-white rounded-xl shadow-md"></div>
          </div>
        </div>
      </div>
      <footer class="text-center text-[10px] text-slate-600 py-4">ZapLink &copy; 2026</footer>
    </section>

    <!-- SCREEN 2: CHAT GLOBAL -->
    <section id="screenChat" class="view-screen hidden-screen h-full flex flex-col">
      <div class="bg-slate-900/90 border-b border-slate-800 px-3 py-2.5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <h3 class="text-xs font-bold text-emerald-400 tracking-wide uppercase"># Chat Global</h3>
        </div>
        <span class="text-[10px] text-slate-400 bg-slate-950 px-2 py-0.5 rounded-full border border-slate-800">Aberto a Todos</span>
      </div>

      <!-- MESSAGES FEED -->
      <div id="chatFeed" class="flex-1 overflow-y-auto p-3 space-y-3 bg-slate-950/80">
        <div class="text-center py-8 text-slate-500 text-xs">Carregando mensagens...</div>
      </div>

      <!-- INPUT BAR -->
      <form id="chatForm" onsubmit="handleSendMessage(event)" class="bg-slate-900 border-t border-slate-800 p-2.5 flex items-center gap-2 shrink-0">
        <input type="text" id="chatInput" placeholder="Escreva sua mensagem no global..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
        <button type="submit" class="w-10 h-10 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-md transition shrink-0">
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </section>

  </main>

  <!-- MODAL: PROFILE & ACCOUNT DELETION -->
  <div id="profileModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-bold text-sm text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-user-pen text-emerald-400"></i> Meu Cadastro / Perfil
        </h3>
        <button onclick="closeProfileModal()" class="text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark text-sm"></i></button>
      </div>

      <div class="space-y-3">
        <div class="p-2.5 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
          <span class="text-[11px] text-slate-400 font-medium">Seu ID (Cadastro):</span>
          <span id="displayMyUid" class="text-xs font-mono font-bold text-emerald-400">...</span>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Seu Nome / Apelido:</label>
          <input type="text" id="profileNameInput" placeholder="Ex: Elias Marinho" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Seu WhatsApp:</label>
          <input type="tel" id="profilePhoneInput" placeholder="(79) 99999-9999" onkeyup="formatPhoneInput(this)" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 font-mono focus:outline-none focus:border-emerald-500">
        </div>

        <button onclick="saveProfileChanges()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold shadow transition">Salvar Alterações</button>
      </div>

      <div class="border-t border-slate-800 pt-3 flex flex-col gap-2">
        <button onclick="deleteMyAccount()" class="w-full py-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-medium transition">
          <i class="fa-solid fa-trash-can mr-1"></i> Deletar Meu Perfil / Cadastro
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    const SUPABASE_URL = 'https://gugupwzmhwodmggsesvh.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_3_MNp_tX0f4txAprVOFAXw_lvomcGvV';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myUserId = localStorage.getItem('zaplink_uid');
    if (!myUserId) {
      myUserId = 'usr_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('zaplink_uid', myUserId);
    }

    let myUserName = localStorage.getItem('zaplink_name') || 'Usuário ' + myUserId.substr(-4);
    let myUserPhone = localStorage.getItem('zaplink_phone') || '';
    let currentTab = 'generator';

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('displayMyUid').innerText = myUserId;
      document.getElementById('profileNameInput').value = myUserName;
      document.getElementById('profilePhoneInput').value = myUserPhone;
      document.getElementById('headerUserName').innerText = myUserName;

      await supabaseClient.from('users').upsert({
        id: myUserId,
        name: myUserName,
        phone: myUserPhone,
        updated_at: new Date()
      });

      setupPresence();
      fetchGlobalMessages();
      listenToRealtimeMessages();
      updateTotalUsersCount();
    });

    function setupPresence() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      if (navigator.onLine) {
        statusDot.className = 'w-2.5 h-2.5 rounded-full status-online';
        statusText.innerText = 'Online';
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const genScreen = document.getElementById('screenGenerator');
      const chatScreen = document.getElementById('screenChat');
      const genBtn = document.getElementById('tabGeneratorBtn');
      const chatBtn = document.getElementById('tabChatBtn');

      if (tab === 'generator') {
        genScreen.classList.remove('hidden-screen');
        chatScreen.classList.add('hidden-screen');
        genBtn.className = "flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition bg-emerald-600 text-white shadow-lg";
        chatBtn.className = "relative flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50";
      } else {
        chatScreen.classList.remove('hidden-screen');
        genScreen.classList.add('hidden-screen');
        chatBtn.className = "relative flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition bg-emerald-600 text-white shadow-lg";
        genBtn.className = "flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50";
        scrollChatToBottom();
      }
    }

    function formatPhoneInput(input) {
      let value = input.value.replace(/\D/g, "");
      if (value.length > 11) value = value.slice(0, 11);
      if (value.length > 6) {
        input.value = `(${value.slice(0,2)}) ${value.slice(2,7)}-${value.slice(7)}`;
      } else if (value.length > 2) {
        input.value = `(${value.slice(0,2)}) ${value.slice(2)}`;
      } else {
        input.value = value;
      }
    }

    function generateWhatsappLink() {
      const phoneRaw = document.getElementById('genPhoneInput').value.replace(/\D/g, "");
      const message = document.getElementById('genMessageInput').value.trim();
      if (phoneRaw.length < 10) { alert("Insira um número válido com DDD."); return; }
      let finalUrl = `https://wa.me/55${phoneRaw}`;
      if (message) finalUrl += `?text=${encodeURIComponent(message)}`;

      document.getElementById('generatedUrlText').innerText = finalUrl;
      document.getElementById('openGeneratedUrlBtn').href = finalUrl;
      document.getElementById('genResultBox').classList.remove('hidden');

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, { text: finalUrl, width: 130, height: 130, colorDark: "#0f172a", colorLight: "#ffffff" });
    }

    function closeResultBox() { document.getElementById('genResultBox').classList.add('hidden'); }
    function copyGeneratedUrl() {
      navigator.clipboard.writeText(document.getElementById('generatedUrlText').innerText);
      alert("Link copiado!");
    }

    async function fetchGlobalMessages() {
      const feed = document.getElementById('chatFeed');
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .eq('room_id', 'global')
        .order('created_at', { ascending: true })
        .limit(50);

      if (error) { feed.innerHTML = '<div class="text-center py-8 text-rose-500 text-xs">Erro ao carregar mensagens.</div>'; return; }
      renderMessagesList(data || []);
    }

    function renderMessagesList(messages) {
      const feed = document.getElementById('chatFeed');
      feed.innerHTML = '';
      if (messages.length === 0) {
        feed.innerHTML = '<div class="text-center py-8 text-slate-600 text-xs italic">Nenhuma mensagem no Chat Global ainda.</div>';
        return;
      }
      messages.forEach(msg => appendSingleMessage(msg, false));
      scrollChatToBottom();
    }

    function listenToRealtimeMessages() {
      supabaseClient
        .channel('public:messages_global')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          if (payload.new.room_id === 'global') {
            appendSingleMessage(payload.new, true);
          }
        })
        .subscribe();
    }

    function appendSingleMessage(msg, shouldScroll) {
      const feed = document.getElementById('chatFeed');
      if (feed.querySelector('.italic')) feed.innerHTML = '';

      const isMe = msg.user_id === myUserId;
      const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const div = document.createElement('div');
      div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-0.5`;
      div.innerHTML = `
        <div class="flex items-center gap-1.5 px-1">
          <span class="text-[10px] font-semibold text-emerald-400">${escapeHtml(msg.user_name || 'Anônimo')}</span>
          <span class="text-[9px] text-slate-500">${timeStr}</span>
        </div>
        <div class="max-w-[85%] px-3 py-2 rounded-2xl text-xs break-words shadow-sm ${isMe ? 'bg-emerald-600 text-white rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'}">
          ${escapeHtml(msg.text)}
        </div>
      `;
      feed.appendChild(div);
      if (shouldScroll) scrollChatToBottom();
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const { error } = await supabaseClient.from('messages').insert({
        room_id: 'global',
        user_id: myUserId,
        user_name: myUserName,
        text: text
      });

      if (error) { alert("Erro ao enviar mensagem."); return; }
      input.value = '';
    }

    function scrollChatToBottom() {
      const feed = document.getElementById('chatFeed');
      feed.scrollTop = feed.scrollHeight;
    }

    async function updateTotalUsersCount() {
      const { count } = await supabaseClient.from('users').select('*', { count: 'exact', head: true });
      if (count !== null) {
        document.getElementById('onlineCountBadge').innerText = count;
      }
    }

    function openProfileModal() { document.getElementById('profileModal').classList.remove('hidden'); }
    function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }

    async function saveProfileChanges() {
      const name = document.getElementById('profileNameInput').value.trim();
      const phone = document.getElementById('profilePhoneInput').value.trim();
      if (!name) return;

      myUserName = name;
      myUserPhone = phone;
      localStorage.setItem('zaplink_name', name);
      localStorage.setItem('zaplink_phone', phone);
      document.getElementById('headerUserName').innerText = name;

      await supabaseClient.from('users').upsert({ id: myUserId, name, phone, updated_at: new Date() });
      alert("Perfil atualizado!");
      closeProfileModal();
    }

    async function deleteMyAccount() {
      if (confirm("Tem certeza que deseja deletar seu perfil e dados do sistema?")) {
        await supabaseClient.from('users').delete().eq('id', myUserId);
        localStorage.clear();
        alert("Perfil excluído com sucesso. A página será recarregada.");
        location.reload();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
